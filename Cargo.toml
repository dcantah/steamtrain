[package]
name = "steamtrain"
version = "0.1.0"
edition = "2021"
description = "Steam library management"

[lib]
name = "steamtrain"
path = "src/lib.rs"

[[bin]]
name = "steamtrain"
path = "src/bin/steamtrain/main.rs"

[dependencies]
walkdir = "=2.3.2"
tui = { version = "=0.17.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.22.1"
chrono = { version = "=0.4.22", default-features = false, features = ["std"] }
unicode-width = "=0.1.10"

[target.'cfg(windows)'.dependencies]
winreg = "=0.10.1"
winapi = { version = "=0.3.9", features = ["std", "fileapi", "minwindef", "winerror"] }

[target.'cfg(target_os = "macos")'.dependencies]
dirs = "=4.0.0"
libc = "=0.2.134"
